<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能医疗助手 - 管理后台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* 头部 */
        .header {
            background: white;
            border-radius: 15px;
            padding: 20px 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
        }
        
        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 10px;
        }
        
        .status-online {
            background: #4CAF50;
            color: white;
        }
        
        .status-offline {
            background: #f44336;
            color: white;
        }
        
        /* 卡片网格 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .card h2 {
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        /* 表格样式 */
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        th {
            background: #f5f5f5;
            font-weight: 600;
        }
        
        /* 表单样式 */
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #555;
        }
        
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5a67d8;
        }
        
        button.danger {
            background: #f44336;
        }
        
        button.danger:hover {
            background: #d32f2f;
        }
        
        /* 号源编辑 */
        .slot-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        
        .slot-name {
            font-weight: 500;
        }
        
        .slot-numbers {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .slot-count {
            background: #e8f5e9;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        .slot-count.full {
            background: #ffebee;
            color: #c62828;
        }
        
        /* 日志区域 */
        .log-area {
            background: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            padding: 15px;
            border-radius: 10px;
            height: 200px;
            overflow-y: auto;
        }
        
        .log-entry {
            padding: 3px 0;
            border-bottom: 1px solid #333;
        }
        
        .log-time {
            color: #858585;
            margin-right: 10px;
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🏥 智能医疗助手 - 管理后台</h1>
            <p>科室管理 | 号源配置 | 数据监控</p>
            <div>
                <span class="status-badge" id="backendStatus">检测中...</span>
            </div>
        </div>
        
        <div class="grid">
            <!-- 科室号源管理 -->
            <div class="card">
                <h2>📋 科室号源管理</h2>
                <div id="departmentsList">
                    <div class="slot-item">
                        <span>加载中...</span>
                    </div>
                </div>
                <div style="margin-top: 15px;">
                    <button onclick="refreshSlots()">🔄 刷新号源</button>
                    <button onclick="resetSlots()" class="danger" style="margin-left: 10px;">↻ 重置所有号源</button>
                </div>
            </div>
            
            <!-- 添加/编辑科室 -->
            <div class="card">
                <h2>➕ 添加/编辑科室</h2>
                <div class="form-group">
                    <label>科室名称</label>
                    <input type="text" id="deptName" placeholder="例如：心内科">
                </div>
                <div class="form-group">
                    <label>总号源数</label>
                    <input type="number" id="deptTotal" value="10" min="1" max="50">
                </div>
                <div class="form-group">
                    <label>剩余号源数</label>
                    <input type="number" id="deptLeft" value="5" min="0">
                </div>
                <button onclick="addDepartment()">➕ 添加科室</button>
            </div>
            
            <!-- 挂号记录 -->
            <div class="card">
                <h2>📝 近期挂号记录</h2>
                <div style="max-height: 300px; overflow-y: auto;">
                    <table id="recordsTable">
                        <thead>
                            <tr><th>时间</th><th>患者</th><th>科室</th><th>单号</th></tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="4">暂无记录</td></tr>
                        </tbody>
                    </table>
                </div>
                <div style="margin-top: 15px;">
                    <button onclick="clearRecords()" class="danger">🗑 清空记录</button>
                </div>
            </div>
            
            <!-- 系统配置 -->
            <div class="card">
                <h2>⚙️ 系统配置</h2>
                <div class="form-group">
                    <label>运行模式</label>
                    <select id="systemMode">
                        <option value="demo">演示模式（离线分诊）</option>
                        <option value="production">生产模式（AI分诊）</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>关怀模式</label>
                    <select id="careMode">
                        <option value="false">关闭</option>
                        <option value="true">开启（大字体/大按钮）</option>
                    </select>
                </div>
                <button onclick="saveConfig()">💾 保存配置</button>
            </div>
        </div>
        
        <!-- 服务日志 -->
        <div class="card">
            <h2>📜 服务日志</h2>
            <div class="log-area" id="logArea">
                <div class="log-entry"><span class="log-time">系统</span> 管理后台已启动</div>
            </div>
            <div style="margin-top: 10px;">
                <button onclick="clearLogs()">清空日志</button>
            </div>
        </div>
    </div>
    
    <script>
        // 后端 API 地址
        const API_BASE = 'http://127.0.0.1:5000';
        
        // 添加日志
        function addLog(message) {
            const logArea = document.getElementById('logArea');
            const time = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.innerHTML = `<span class="log-time">${time}</span> ${message}`;
            logArea.insertBefore(logEntry, logArea.firstChild);
            if (logArea.children.length > 50) {
                logArea.removeChild(logArea.lastChild);
            }
        }
        
        // 检查后端状态
        async function checkBackendStatus() {
            try {
                const response = await fetch(`${API_BASE}/api/health`);
                const data = await response.json();
                const statusBadge = document.getElementById('backendStatus');
                statusBadge.textContent = '✅ 后端已连接';
                statusBadge.className = 'status-badge status-online';
                addLog('后端服务连接成功');
                return true;
            } catch (error) {
                const statusBadge = document.getElementById('backendStatus');
                statusBadge.textContent = '❌ 后端未连接';
                statusBadge.className = 'status-badge status-offline';
                addLog('❌ 后端服务连接失败');
                return false;
            }
        }
        
        // 刷新号源
        async function refreshSlots() {
            try {
                const response = await fetch(`${API_BASE}/api/hospital/status`);
                const data = await response.json();
                if (data.success) {
                    const deptList = document.getElementById('departmentsList');
                    deptList.innerHTML = '';
                    for (const [dept, info] of Object.entries(data.hospital_status)) {
                        const slotItem = document.createElement('div');
                        slotItem.className = 'slot-item';
                        const statusClass = info.left === 0 ? 'slot-count full' : 'slot-count';
                        slotItem.innerHTML = `
                            <span class="slot-name">${dept}</span>
                            <div class="slot-numbers">
                                <span class="${statusClass}">剩余: ${info.left}/${info.total}</span>
                                <button onclick="editDepartment('${dept}', ${info.total}, ${info.left})">✏️ 编辑</button>
                                <button onclick="deleteDepartment('${dept}')" class="danger" style="background:#f44336;padding:5px 10px;">🗑</button>
                            </div>
                        `;
                        deptList.appendChild(slotItem);
                    }
                    addLog('刷新号源成功');
                }
            } catch (error) {
                addLog('❌ 刷新号源失败');
            }
        }
        
        // 重置所有号源
        async function resetSlots() {
            if (!confirm('确定要重置所有科室号源吗？')) return;
            try {
                const response = await fetch(`${API_BASE}/api/hospital/reset`, { method: 'POST' });
                const data = await response.json();
                if (data.success) {
                    addLog('✅ 号源已重置');
                    refreshSlots();
                }
            } catch (error) {
                addLog('❌ 重置失败');
            }
        }
        
        // 添加科室
        async function addDepartment() {
            const name = document.getElementById('deptName').value.trim();
            const total = parseInt(document.getElementById('deptTotal').value);
            const left = parseInt(document.getElementById('deptLeft').value);
            if (!name) {
                alert('请输入科室名称');
                return;
            }
            try {
                const response = await fetch(`${API_BASE}/api/hospital/department`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, total, left })
                });
                const data = await response.json();
                if (data.success) {
                    addLog(`✅ 添加科室: ${name}`);
                    refreshSlots();
                    document.getElementById('deptName').value = '';
                } else {
                    alert(data.message);
                }
            } catch (error) {
                addLog('❌ 添加科室失败');
            }
        }
        
        // 编辑科室（简化版，直接弹窗修改）
        function editDepartment(name, total, left) {
            const newTotal = prompt(`修改 ${name} 总号源`, total);
            const newLeft = prompt(`修改 ${name} 剩余号源`, left);
            if (newTotal && newLeft) {
                updateDepartment(name, parseInt(newTotal), parseInt(newLeft));
            }
        }
        
        async function updateDepartment(name, total, left) {
            try {
                const response = await fetch(`${API_BASE}/api/hospital/department/${name}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ total, left })
                });
                const data = await response.json();
                if (data.success) {
                    addLog(`✅ 更新科室: ${name}`);
                    refreshSlots();
                }
            } catch (error) {
                addLog('❌ 更新失败');
            }
        }
        
        // 删除科室
        async function deleteDepartment(name) {
            if (!confirm(`确定要删除科室 "${name}" 吗？`)) return;
            try {
                const response = await fetch(`${API_BASE}/api/hospital/department/${name}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                if (data.success) {
                    addLog(`✅ 删除科室: ${name}`);
                    refreshSlots();
                }
            } catch (error) {
                addLog('❌ 删除失败');
            }
        }
        
        // 清空记录
        async function clearRecords() {
            if (!confirm('确定要清空所有挂号记录吗？')) return;
            try {
                const response = await fetch(`${API_BASE}/api/hospital/records`, { method: 'DELETE' });
                const data = await response.json();
                if (data.success) {
                    addLog('✅ 挂号记录已清空');
                    loadRecords();
                }
            } catch (error) {
                addLog('❌ 清空失败');
            }
        }
        
        // 加载挂号记录
        async function loadRecords() {
            try {
                const response = await fetch(`${API_BASE}/api/hospital/records`);
                const data = await response.json();
                if (data.success) {
                    const tbody = document.querySelector('#recordsTable tbody');
                    tbody.innerHTML = '';
                    for (const record of data.records.slice(-10).reverse()) {
                        const row = tbody.insertRow();
                        row.insertCell(0).textContent = record.timestamp || '-';
                        row.insertCell(1).textContent = record.patient_name;
                        row.insertCell(2).textContent = record.department;
                        row.insertCell(3).textContent = record.ticket_id;
                    }
                }
            } catch (error) {
                // 忽略
            }
        }
        
        // 保存配置
        function saveConfig() {
            const mode = document.getElementById('systemMode').value;
            const careMode = document.getElementById('careMode').value;
            // 这里可以保存到 localStorage 或后端
            localStorage.setItem('medical_mode', mode);
            localStorage.setItem('medical_care_mode', careMode);
            addLog(`⚙️ 配置已保存 - 模式: ${mode}, 关怀模式: ${careMode === 'true' ? '开启' : '关闭'}`);
            alert('配置已保存，重启客户端生效');
        }
        
        // 加载保存的配置
        function loadConfig() {
            const mode = localStorage.getItem('medical_mode');
            const careMode = localStorage.getItem('medical_care_mode');
            if (mode) document.getElementById('systemMode').value = mode;
            if (careMode) document.getElementById('careMode').value = careMode;
        }
        
        function clearLogs() {
            const logArea = document.getElementById('logArea');
            logArea.innerHTML = '<div class="log-entry"><span class="log-time">系统</span> 日志已清空</div>';
        }
        
        // 初始化
        async function init() {
            loadConfig();
            await checkBackendStatus();
            await refreshSlots();
            await loadRecords();
            // 定时刷新
            setInterval(refreshSlots, 30000);
            setInterval(checkBackendStatus, 60000);
        }
        
        init();
    </script>
</body>
</html>
